<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">动态骑自行车的光头强</title>
  <desc id="desc">卡通风格的光头强骑自行车，车轮、脚踏、道路和树木持续运动。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8edcff"/><stop offset="1" stop-color="#d9f6ff"/></linearGradient>
    <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#8bd36d"/><stop offset="1" stop-color="#4b9b57"/></linearGradient>
    <linearGradient id="vest" x2="1" y2="1"><stop stop-color="#ff9e32"/><stop offset="1" stop-color="#e3631d"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#707b86"/><stop offset="1" stop-color="#404852"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1b4450" flood-opacity=".25"/></filter>
    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin .85s linear infinite; }
      .roadline { animation: road 1.3s linear infinite; }
      .roadline.slow { animation-duration: 1.8s; opacity:.55; }
      .rider { animation: bounce .42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
      .leg-front { animation: legFront 1s ease-in-out infinite; transform-box: fill-box; transform-origin: 14% 18%; }
      .leg-back { animation: legBack 1s ease-in-out infinite; transform-box: fill-box; transform-origin: 14% 18%; }
      .tree { animation: sway 2.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
      .tree.delay { animation-delay: -.9s; }
      .dust { animation: dust 1.4s ease-out infinite; }
      .dust.d2 { animation-delay: -.7s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes road { from { transform: translateX(0); } to { transform: translateX(-160px); } }
      @keyframes bounce { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-4px) rotate(1deg); } }
      @keyframes legFront { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(22deg); } }
      @keyframes legBack { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(-18deg); } }
      @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
      @keyframes dust { 0% { opacity:0; transform: translate(0,0) scale(.5); } 25% { opacity:.5; } 100% { opacity:0; transform: translate(-55px,-18px) scale(1.4); } }
    </style>
    <g id="cloud"><path d="M0 22c0-13 10-22 23-22 8 0 15 4 19 11 4-6 10-9 18-9 12 0 22 9 22 21H0z" fill="#fff" opacity=".9"/></g>
    <g id="treeShape"><rect x="-8" y="66" width="16" height="58" rx="5" fill="#754529"/><circle cx="0" cy="44" r="30" fill="#4eaf5f"/><circle cx="-20" cy="57" r="23" fill="#63bf65"/><circle cx="21" cy="58" r="22" fill="#42a654"/><circle cx="0" cy="24" r="20" fill="#70cb70"/></g>
  </defs>

  <rect width="900" height="520" rx="28" fill="url(#sky)"/>
  <g opacity=".85"><use xlink:href="#cloud" x="72" y="62"/><use xlink:href="#cloud" x="650" y="84" transform="scale(.8) translate(160 18)"/></g>
  <path d="M0 280 Q130 180 260 280 T520 265 T780 275 T1040 255 V390 H0Z" fill="url(#hill)"/>
  <path d="M0 322 Q180 245 335 322 T660 310 T980 305 V390 H0Z" fill="#388e50" opacity=".58"/>
  <g class="tree" transform="translate(112 190) scale(1.08)"><use xlink:href="#treeShape"/></g>
  <g class="tree delay" transform="translate(766 184) scale(.92)"><use xlink:href="#treeShape"/></g>
  <g class="tree" transform="translate(45 250) scale(.58)"><use xlink:href="#treeShape"/></g>
  <g class="tree delay" transform="translate(844 250) scale(.62)"><use xlink:href="#treeShape"/></g>

  <path d="M0 363 Q440 330 900 360 V520 H0Z" fill="url(#road)"/>
  <g fill="#f7e7a2">
    <rect class="roadline" x="-30" y="422" width="100" height="10" rx="5"/><rect class="roadline" x="175" y="408" width="100" height="10" rx="5"/><rect class="roadline" x="380" y="401" width="100" height="10" rx="5"/><rect class="roadline" x="585" y="405" width="100" height="10" rx="5"/><rect class="roadline" x="790" y="416" width="100" height="10" rx="5"/>
    <rect class="roadline slow" x="15" y="478" width="150" height="7" rx="3"/><rect class="roadline slow" x="280" y="470" width="150" height="7" rx="3"/><rect class="roadline slow" x="545" y="472" width="150" height="7" rx="3"/><rect class="roadline slow" x="810" y="482" width="150" height="7" rx="3"/>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="456" cy="456" rx="196" ry="18" fill="#18252c" opacity=".28"/>
  <!-- bicycle -->
  <g stroke="#202b32" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="6">
      <circle class="wheel" cx="300" cy="400" r="64" fill="#d9e3e7" stroke="#26353d"/>
      <circle class="wheel" cx="600" cy="400" r="64" fill="#d9e3e7" stroke="#26353d"/>
      <path class="wheel" d="M300 336v128M236 400h128M255 355l90 90M255 445l90-90" stroke="#7d929b" stroke-width="2"/>
      <path class="wheel" d="M600 336v128M536 400h128M555 355l90 90M555 445l90-90" stroke="#7d929b" stroke-width="2"/>
      <path d="M300 400 L385 300 L505 400 L300 400 L430 400 L385 300" fill="none" stroke="#e64c28" stroke-width="8"/>
      <path d="M505 400 L560 300 M560 300h38 M560 300l-12-16" fill="none" stroke="#e64c28" stroke-width="8"/>
      <path d="M385 300l-10-26h32" fill="none" stroke="#e64c28" stroke-width="7"/>
      <path d="M300 400h34" fill="none" stroke="#202b32" stroke-width="8"/>
    </g>
    <g class="pedal" fill="none" stroke="#202b32" stroke-width="5">
      <circle cx="430" cy="400" r="16" fill="#f0a629" stroke="#202b32"/>
      <path d="M430 400l21-18m-21 18l-20 18"/>
      <path d="M451 382h18m-38 36h-18" stroke-width="7"/>
    </g>
    <path d="M543 289q18 6 31 17" fill="none" stroke="#202b32" stroke-width="7"/>
  </g>

  <!-- rider -->
  <g class="rider" filter="url(#shadow)">
    <!-- back leg -->
    <g class="leg-back" stroke="#202b32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M426 321 L462 363 L430 400" fill="none" stroke="#1f4a72" stroke-width="22"/>
      <path d="M430 400l-12 8" stroke="#f2a25b" stroke-width="8"/>
      <path d="M405 412h25" stroke="#262d36" stroke-width="8"/>
    </g>
    <!-- torso and arm -->
    <path d="M414 210 Q448 193 481 218 L510 286 Q472 311 424 288Z" fill="url(#vest)" stroke="#3a2920" stroke-width="5"/>
    <path d="M445 216v76M470 214l18 71" stroke="#ffd05b" stroke-width="7" opacity=".9"/>
    <path d="M476 224 Q507 238 541 285" fill="none" stroke="#f2a25b" stroke-width="16"/>
    <path d="M531 280 Q548 289 558 295" fill="none" stroke="#f2a25b" stroke-width="10"/>
    <!-- front leg -->
    <g class="leg-front" stroke="#202b32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M438 286 L470 338 L430 400" fill="none" stroke="#285b88" stroke-width="22"/>
      <path d="M430 400l-9 7" stroke="#f2a25b" stroke-width="8"/>
      <path d="M402 414h26" stroke="#262d36" stroke-width="8"/>
    </g>
    <!-- neck and head -->
    <path d="M434 207v-26h27v29" fill="#f2a25b" stroke="#3a2920" stroke-width="4"/>
    <ellipse cx="448" cy="151" rx="43" ry="49" fill="#f2a25b" stroke="#3a2920" stroke-width="5"/>
    <path d="M409 146q4-47 39-52 36 5 41 50-12-16-25-22-28 16-55 24z" fill="#f4bd45" stroke="#3a2920" stroke-width="5"/>
    <path d="M412 170q10 30 36 31 25-1 36-31-9 10-36 11-28-1-36-11z" fill="#7b3e25"/>
    <circle cx="432" cy="153" r="5" fill="#252525" stroke="none"/><circle cx="463" cy="153" r="5" fill="#252525" stroke="none"/>
    <path d="M438 172q11 6 22 0" fill="none" stroke="#40231a" stroke-width="3"/>
    <path d="M405 138q-4 20 3 33M487 138q4 20-3 33" fill="none" stroke="#3a2920" stroke-width="5"/>
    <!-- neckerchief -->
    <path d="M425 204l24 15 25-15-5 27-20 10-20-10z" fill="#d33c2e" stroke="#3a2920" stroke-width="4"/>
  </g>

  <!-- motion dust -->
  <g fill="#d7c9a0">
    <circle class="dust" cx="235" cy="438" r="8"/><circle class="dust d2" cx="208" cy="450" r="5"/><circle class="dust" cx="260" cy="452" r="4"/>
  </g>
  <g transform="translate(55 38)"><rect width="210" height="44" rx="22" fill="#173d4a" opacity=".82"/><text x="105" y="29" fill="#fff" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif">光头强 · 骑行中</text></g>
</svg>
