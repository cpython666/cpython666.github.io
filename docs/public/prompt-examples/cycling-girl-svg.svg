<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">微风里，骑自行车的姑娘</title>
  <desc id="desc">一位戴珊瑚色头盔、穿条纹上衣、蓝色短裤和渔网袜的姑娘，骑着薄荷绿自行车向右前行。车篮里装着鲜花，背景是奶油色天空、太阳和淡绿色的树。</desc>
  <defs>
    <pattern id="paper" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r=".8" fill="#8b826f" opacity=".10"/>
      <circle cx="25" cy="29" r=".65" fill="#8b826f" opacity=".10"/>
    </pattern>
    <pattern id="fishnet" width="18" height="24" patternUnits="userSpaceOnUse">
      <path d="M-9 0 9 24M9 0 27 24M-9 24 9 0M9 24 27 0" fill="none" stroke="#35444b" stroke-width="1.35" opacity=".76"/>
    </pattern>
    <pattern id="wicker" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M0 0V18M9 0V18M0 5H18M0 14H18" fill="none" stroke="#98663e" stroke-width="1.7" opacity=".42"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fbf5eb"/>
      <stop offset="1" stop-color="#f5eee0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1ebe2"/>
      <stop offset="1" stop-color="#edf0df"/>
    </linearGradient>
    <linearGradient id="stocking" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddb09b"/>
      <stop offset="1" stop-color="#efc7ae"/>
    </linearGradient>
