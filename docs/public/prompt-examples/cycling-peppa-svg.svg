  <title id="title">小猪佩奇骑自行车</title>
  <desc id="desc">佩奇穿着红裙子，骑着青绿色自行车穿过阳光下的草地。双脚交替踩踏，车轮旋转，白云和路边的小花缓缓向后移动。无限循环的原生 SVG 动画。</desc>
